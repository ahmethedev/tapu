name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the minimum in package.json "engines".
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tapu
          POSTGRES_PASSWORD: tapu-test-pw
          POSTGRES_DB: tapu_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U tapu -d tapu_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TAPU_TEST_DATABASE_URL: postgres://tapu:tapu-test-pw@localhost:54329/tapu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
