# Test database for Tapu. Start with `docker compose up -d`, then:
#   export TAPU_TEST_DATABASE_URL=postgres://tapu:tapu-test-pw@localhost:54329/tapu_test
# The password is distinctive so the credential-scrubbing tests cannot match ordinary words.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tapu
      POSTGRES_PASSWORD: tapu-test-pw
      POSTGRES_DB: tapu_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapu -d tapu_test"]
      interval: 2s
      timeout: 5s
      retries: 20
